# Local development services. The Control Server connects to this MySQL instance.
# Start with:  pnpm db:up   (or)  docker compose up -d mysql
#
# Host port is configurable via MYSQL_PORT (default 3306) for machines that
# already run MySQL on 3306; keep DATABASE_URL in apps/server/.env in sync.
services:
  mysql:
    image: mysql:8.0
    container_name: agentdock-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: agentdock
      MYSQL_DATABASE: agentdock
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - agentdock-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agentdock-mysql-data:
